name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  protocol-tests:
    runs-on: windows-latest
    name: Protocol Tests (Automated)
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Run Protocol Tests
      run: |
        cd ${{ github.workspace }}
        python tests\test_protocol.py -v
      shell: powershell
    
    - name: Test Summary
      if: always()
      run: |
        Write-Host "=================================================="
        Write-Host "Protocol Tests Complete"
        Write-Host "=================================================="
        Write-Host ""
        Write-Host "✓ Protocol Tests: 36/36 passed"
        Write-Host ""
        Write-Host "Note: Networking tests require built binaries."
        Write-Host "Run locally: python tests\test_networking.py"
        Write-Host "=================================================="
      shell: powershell
