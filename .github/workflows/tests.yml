name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  cpp-unit-tests:
    runs-on: windows-latest
    name: C++ Unit Tests (Google Test)
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DBUILD_TESTS=ON
      shell: powershell
    
    - name: Build Tests
      run: |
        cd build
        cmake --build . --config Release --target test_game_logic test_player_ids test_controller_management test_game_mechanics test_karting_mechanics
      shell: powershell

    - name: Build GameServer
      run: |
        cd build
        cmake --build . --config Release --target GameServer
      shell: powershell

    - name: Upload GameServer
      uses: actions/upload-artifact@v4
      with:
        name: gameserver-release
        path: build/bin/Release/GameServer.exe
    
    - name: Run C++ Tests
      run: |
        cd build/tests
        ctest -C Release --output-on-failure
      shell: powershell
    
    - name: Test Summary
      if: always()
      run: |
        Write-Host '=========================================='
        Write-Host 'C++ Unit Tests Complete'
        Write-Host '=========================================='
      shell: powershell

  protocol-tests:
    runs-on: windows-latest
    name: Protocol Tests (Python)
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Run Protocol Tests
      run: |
        cd ${{ github.workspace }}
        python tests\test_protocol.py -v
      shell: powershell
    
    - name: Test Summary
      if: always()
      run: |
        Write-Host '=========================================='
        Write-Host 'Protocol Tests Complete'
        Write-Host '=========================================='
      shell: powershell

  networking-tests:
    needs: cpp-unit-tests
    runs-on: windows-latest
    name: Networking Tests (Integration)
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Download GameServer
      uses: actions/download-artifact@v4
      with:
        name: gameserver-release
        path: build/bin/Release
    
    - name: Start GameServer
      run: |
        Start-Process -FilePath "${{ github.workspace }}\build\bin\Release\GameServer.exe" -WindowStyle Hidden
        Start-Sleep -Seconds 2
      shell: powershell
    
    - name: Run Networking Tests
      run: |
        cd ${{ github.workspace }}
        python tests\test_networking.py -v
      shell: powershell
    
    - name: Stop GameServer
      if: always()
      run: |
        Stop-Process -Name GameServer -Force -ErrorAction SilentlyContinue
      shell: powershell
    
    - name: Test Summary
      if: always()
      run: |
        Write-Host '=========================================='
        Write-Host 'Networking Tests Complete'
        Write-Host '=========================================='
      shell: powershell
