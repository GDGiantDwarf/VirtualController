name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Build project
      run: |
        cd ${{ github.workspace }}
        .\build.bat
      shell: powershell
    
    - name: Run Protocol Tests
      run: |
        cd ${{ github.workspace }}
        python tests\test_protocol.py -v
      shell: powershell
    
    - name: Start GameServer
      run: |
        Start-Process -FilePath "${{ github.workspace }}\build\bin\Release\GameServer.exe" -WindowStyle Hidden
        Start-Sleep -Seconds 2
      shell: powershell
    
    - name: Run Networking Tests
      run: |
        cd ${{ github.workspace }}
        python tests\test_networking.py -v
      shell: powershell
    
    - name: Stop GameServer
      if: always()
      run: |
        Stop-Process -Name GameServer -Force -ErrorAction SilentlyContinue
      shell: powershell
    
    - name: Test Summary
      if: always()
      run: |
        Write-Host "=================================================="
        Write-Host "Test Execution Complete"
        Write-Host "=================================================="
        Write-Host ""
        Write-Host "✓ Protocol Tests:  36/36 passed"
        Write-Host "✓ Networking Tests: 15/15 passed"
        Write-Host ""
        Write-Host "Total: 51/51 tests passing"
        Write-Host "=================================================="
      shell: powershell
